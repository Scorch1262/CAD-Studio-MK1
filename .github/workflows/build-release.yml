name: Build und Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Pruefen, dass Fenster- und USB-Bibliotheken vorhanden sind
        run: python -c "import webview, hid; print('pywebview + hidapi ok')"

      - name: Modellierkern usd-brep pruefen
        shell: bash
        run: |
          python -c "import kernel, json; i = kernel.KERNEL.info(); print(json.dumps(i))"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -c "import kernel, json; r = kernel.selftest(); print(json.dumps(r)); assert r['manifold'] and all(v == 'ok' for v in r['status'].values())"
          else
            echo "macOS: NVIDIA bietet usd-brep nicht fuer macOS an - die App nutzt den internen Kern."
          fi

      - name: Kurztest (interner Server startet, Oberflaeche wird ausgeliefert)
        shell: bash
        env:
          CADSTUDIO_MODE: server
          CADSTUDIO_PORT: '8877'
        run: |
          python cadstudio.py &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8877/api/state > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8877/api/state
          curl -sf -o /dev/null http://127.0.0.1:8877/
          curl -sf -o /dev/null http://127.0.0.1:8877/js/app.js
          curl -sf -o /dev/null http://127.0.0.1:8877/vendor/occt/occt-import-js.wasm
          curl -sf -X POST http://127.0.0.1:8877/api/shutdown || kill $PID || true

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean CAD-Studio-MK1.spec

      - name: Selbsttest der fertigen exe (Kern usd-brep im Paket)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CADSTUDIO_PORT = '8878'
          $p = Start-Process -FilePath dist/CAD-Studio-MK1.exe -ArgumentList '--server' -PassThru
          $up = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8878/api/state -TimeoutSec 5 | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $up) {
            Get-Content "$env:USERPROFILE\.cad-studio-mk1\cad-studio-mk1.log" -ErrorAction SilentlyContinue
            Stop-Process $p -Force -ErrorAction SilentlyContinue
            throw 'Die exe startet nicht'
          }
          $resp = Invoke-WebRequest http://127.0.0.1:8878/api/kernel/selftest -SkipHttpErrorCheck -TimeoutSec 120
          Write-Host $resp.Content
          try { Invoke-RestMethod -Method Post http://127.0.0.1:8878/api/shutdown | Out-Null } catch {}
          $r = $resp.Content | ConvertFrom-Json
          if (-not $r.ok -or -not $r.kernel.available) {
            Get-Content "$env:USERPROFILE\.cad-studio-mk1\cad-studio-mk1.log" -ErrorAction SilentlyContinue
            throw 'usd-brep-Kern in der exe nicht funktionsfaehig'
          }

      - name: Selbsttest der fertigen App (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          CADSTUDIO_PORT=8878 dist/CAD-Studio-MK1.app/Contents/MacOS/CAD-Studio-MK1 --server &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8878/api/state > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8878/api/kernel/info
          curl -sf -X POST http://127.0.0.1:8878/api/shutdown || true

      - name: Paket Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item dist/CAD-Studio-MK1.exe "out/CAD-Studio-MK1-$v-windows-x64.exe"

      - name: Paket macOS
        if: runner.os == 'macOS'
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          arch=$(uname -m)
          mkdir -p out
          # ad-hoc signieren, damit die App auf Apple Silicon startet
          codesign --force --deep --sign - dist/CAD-Studio-MK1.app || true
          ditto -c -k --sequesterRsrc --keepParent dist/CAD-Studio-MK1.app "out/CAD-Studio-MK1-$v-macos-$arch.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CAD-Studio-MK1-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  release:
    name: Release erstellen
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Version und Tag bestimmen
        id: ver
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$v-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Release-Text
        run: |
          {
            echo "CAD-Studio-MK1 ${{ steps.ver.outputs.version }} (Build ${{ github.run_number }})"
            echo
            echo "- Windows 10/11: CAD-Studio-MK1-*-windows-x64.exe starten (benoetigt die WebView2-Laufzeit, auf Windows 11 vorinstalliert)"
            echo "- macOS 12 oder neuer: ZIP entpacken, CAD-Studio-MK1.app beim ersten Mal per Rechtsklick > Oeffnen starten (nicht notarisiert)"
            echo
            echo "CAD-Studio-MK1 laeuft als eigenes Programmfenster, kein Browser noetig. Die SpaceMouse wird direkt per USB erkannt."
            echo "Modellierkern: NVIDIA usd-brep (exakte NURBS-B-Rep) in der Windows-exe. macOS: interner Kern, da usd-brep fuer macOS nicht angeboten wird."
            echo
            awk '/^## /{n++} n==1' CHANGELOG.md
          } > release_notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CAD-Studio-MK1 ${{ steps.ver.outputs.version }} (Build ${{ github.run_number }})
          body_path: release_notes.md
          files: dist/*
          make_latest: true
